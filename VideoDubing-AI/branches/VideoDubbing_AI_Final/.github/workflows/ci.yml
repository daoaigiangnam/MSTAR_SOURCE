name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/worker

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install worker dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall worker
      - name: Run unit and contract tests
        run: pytest -m "not integration" -q

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run API tests
        run: npm test

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config -q

  docker-build:
    runs-on: ubuntu-latest
    needs: [worker-tests, api-tests, compose-validation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t videodubing-worker:ci ./worker
      - name: Build API image
        run: docker build -t videodubing-api:ci ./api
