name: Compose Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build services
        run: docker compose build api worker
      - name: Start stack
        run: docker compose up -d libretranslate worker api
      - name: Wait for worker
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 5
          done
          docker compose logs worker
          exit 1
      - name: Worker health assertion
        run: curl -fsS http://localhost:8000/health | grep '"status":"ok"'
      - name: API health assertion
        run: curl -fsS http://localhost:3000/health | grep '"status":"ok"'
      - name: API version assertion
        run: curl -fsS http://localhost:3000/api/v1 | grep '"version":"v1"'
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Shutdown
        if: always()
        run: docker compose down -v
