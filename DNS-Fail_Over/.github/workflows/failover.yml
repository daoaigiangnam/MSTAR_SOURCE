
name: DNS Failover

on:

  workflow_dispatch:

  schedule:

    - cron: "*/5 * * * *"

jobs:

  failover:

    runs-on: [self-hosted, linux, x64, dns-failover]

    timeout-minutes: 10

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout Source

        uses: actions/checkout@v4

      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: "pip"

      # ==========================================
      # Install
      # ==========================================

      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      # ==========================================
      # Run DNS Failover
      # ==========================================

      - name: Execute DNS Failover

        env:

          CF_TOKEN: ${{ secrets.CF_TOKEN }}

          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          

        run: |

          python src/main.py

      # ==========================================
      # Finish
      # ==========================================

      - name: Finished

        if: always()

        run: |

          echo "====================================="

          echo "DNS Failover Finished"

          echo "====================================="

